# =============================================================================
# Criteria Register — DRAFT v0.2 (job specification received and cross-checked)
# =============================================================================
# STATUS: PROVISIONAL — NOT AUTHORISED.
# Changes from v0.1:
#   - Job specification received (config/authorised-inputs/Job-Specification.docx)
#     and parsed; spec coverage matrix added; rationales now verified against it.
#   - PROPOSED additions (E5, G1, G2) marked for owner review — NOT active until
#     approved at sign-off.
#   - Policy note added: spec states prior motorsport interest is NOT required —
#     recorded as an explicit non-criterion to prevent assessor drift.
#
# SIGN-OFF ITEMS (owner must decide; unchanged items from v0.1 marked *):
#   S1*. Weighting scheme: none supplied by framework or spec. Default below is
#        unweighted bands + essential gates.
#   S2*. Partial band value: drafted as 1 (option: 2; 0 forbidden).
#   S3*. Cover letters = equal-status evidence source (default: yes).
#   S4*. E4 values list confirm: Accountable, Brave, Competitive, Selfless
#        (verified present in spec verbatim).
#   S5.  Approve/modify/reject PROPOSED E5, G1, G2 below.
#   S6.  Confirm this document is the COMPLETE authorised specification (it
#        contains only the criteria section — no role purpose/responsibilities).
# =============================================================================

criteria_version: 0.2.0-draft
source_documents:
  - config/authorised-inputs/assessment-framework-draft-v0.1.md
  - config/authorised-inputs/Job-Specification.docx
authorised_by: null            # MUST be set (name/role + date) at sign-off
authorised_date: null
weighting_scheme: unweighted_bands_plus_gates   # provisional; see open item S1

# Default rubric: assessment class -> band (null = excluded from scoring, not 0)
scoring_rubric:
  STRONG_EVIDENCE: 4
  EVIDENCE: 3
  PARTIAL_EVIDENCE: 1          # open item S2
  NO_EVIDENCE_FOUND: null
  CONFLICTING_EVIDENCE: null
  NOT_ASSESSABLE: null

# -----------------------------------------------------------------------------
# Spec coverage matrix (verified 2026-10-28)
# -----------------------------------------------------------------------------
spec_coverage:
  spec_essentials:
    "Be enrolled on an eligible degree course, with at least one year remaining…":
      covered: proposed    # → G1 (eligibility gate, PROPOSED)
    "Have a strong background in an engineering discipline, with excellent skills in Mathematics and Physics.":
      covered: proposed    # → E5 (PROPOSED)
    "Have a passion for design and problem solving, and be excited by the opportunity to apply your skills…":
      covered: yes         # → E1, E2
    "Be able to work from our campus in Brackley, United Kingdom, for the duration of the placement.":
      covered: proposed    # → G2 (eligibility gate, PROPOSED)
    "Demonstrate how your experiences … reflect our shared values: Accountable, Brave, Competitive and Selfless":
      covered: yes         # → E4 (values list matches spec verbatim)
  spec_desirables:
    "Experience using CAD, 3D modelling or other design tools.": covered: yes    # → D1
    "Programming, scripting, practical use of AI tools, or experience improving engineering processes.":
      covered: yes         # → D2
    "An adaptable, proactive and collaborative approach, with the ability to contribute effectively in a team environment.":
      covered: yes         # → D3
    "Keen attention to detail, with an analytical and inquisitive approach.":
      covered: yes         # → D4 (inquisitive also supported by E3)
    "Determination and resilience when facing challenges, with an interest in continuous improvement.":
      covered: yes         # → D5
  spec_negative_constraints:
    - >
      "A prior interest in motorsport is not required: we are more interested in
      your curiosity, technical potential and motivation…" — recorded as an
      explicit NON-criterion. Assessors/prompts must not reward or penalise
      motorsport interest. (Corpus note: most candidates have Formula Student
      experience; this constraint prevents that from becoming a hidden
      requirement.)
  spec_non_criteria:
    - >
      "Key skills you will learn on placement" (CAD CATIA 3DX, F1 Technical
      Regulations, Design Process, Idea Development, Team Collaboration, Time
      Management, Adaptability) are placement LEARNING OUTCOMES, not assessment
      criteria. They inform evidence_expectation wording only (e.g. D1's
      no-CATIA-requirement exclusion) and must never be scored.

# -----------------------------------------------------------------------------
# Eligibility gates (deterministic checks, not scored assessments)
# -----------------------------------------------------------------------------
gates:

  - gate_id: G1
    status: PROPOSED_OWNER_REVIEW
    description: >
      Enrolment eligibility: candidate must be enrolled on an eligible degree
      course with at least one year remaining on the current course (or
      confirmed enrolment on the next course) from the placement start date.
      Masters/PhD candidates must evidence enrolment.
    check_type: documentary
    evidence_source: >
      Education entries in CV (degree, institution, date range) + ATS form.
      Assessable as: degree course visible AND end date at least one year after
      placement start. If unclear → GATE_UNCLEAR, human review — never auto-fail.
    on_fail: GATE_NOT_EVIDENCED     # surfaced to reviewer; not silently scored 0

  - gate_id: G2
    status: PROPOSED_OWNER_REVIEW
    description: >
      Location eligibility: able to work from the Brackley, UK campus for the
      placement duration.
    check_type: documentary
    evidence_source: >
      Only weakly assessable from documents (e.g. country of residence, explicit
      statements). Treat as INFORMATIONAL for reviewer attention unless the
      framework owner defines a rule; do not infer from nationality or location
      proxies (fairness constraint — see plan §20).
    on_fail: GATE_UNCLEAR_DEFAULT_INFO

criteria:

  - criterion_id: E1
    description: >
      Applied engineering problem solving: the ability to understand a technical
      problem, develop or evaluate solutions, and apply engineering reasoning to
      a practical challenge.
    category: PROBLEM_SOLVING
    essential: true
    priority_note: Highest assessment priority per framework owner.
    spec_source: "Have a passion for design and problem solving, and be excited by the opportunity to apply your skills and understanding to practical engineering challenges."
    weighting: null             # see open item S1
    evidence_expectation:
      STRONG_EVIDENCE: >
        Multiple examples where the candidate identifies the problem, explains
        their contribution or approach, and provides an outcome; evidence of
        iteration, investigation, trade-offs or learning.
      EVIDENCE: >
        One clear example of tackling an engineering or technical problem and
        applying knowledge to reach a solution.
      PARTIAL_EVIDENCE: >
        Participation in an engineering project is stated, but the candidate's
        contribution or reasoning is unclear.
      NO_EVIDENCE_FOUND: No applied problem-solving evidence located.
    rationale: >
      Spec essential criterion (verbatim coverage confirmed).

  - criterion_id: E2
    description: >
      Design and making: genuine engagement with designing, developing, building
      or improving something, physical or digital.
    category: DESIGN_MAKE
    essential: true
    spec_source: "Have a passion for design and problem solving… (design emphasis)"
    weighting: null
    evidence_expectation:
      STRONG_EVIDENCE: >
        Multiple examples of developing a design from problem/idea through
        iteration, manufacture, implementation or testing.
      EVIDENCE: One clear example of designing, building or developing something.
      PARTIAL_EVIDENCE: >
        Candidate says they enjoy design or lists design tools but gives no
        applied example.
      NO_EVIDENCE_FOUND: No design/development activity identified.
    exclusions:
      - >
        Do NOT require CAD: this criterion intentionally excludes CAD as a
        requirement (the placement teaches CATIA 3DX); CAD evidence is covered
        by D1.
    rationale: >
      Reflects the role's emphasis on design while avoiding turning the desirable
      CAD criterion into an accidental prerequisite.

  - criterion_id: E3
    description: >
      Technical curiosity and learning: active learning, investigation or
      experimentation beyond simply completing assigned tasks.
    category: LEARNING_AGILITY
    essential: true
    spec_source: "A prior interest in motorsport is not required: we are more interested in your curiosity, technical potential and motivation to work in a high-performance engineering environment."
    weighting: null
    evidence_expectation:
      STRONG_EVIDENCE: >
        Multiple examples of independently learning something, investigating
        alternatives, experimenting or applying new knowledge.
      EVIDENCE: >
        One clear example of independently learning or exploring a technical
        subject.
      PARTIAL_EVIDENCE: >
        Claims curiosity, enthusiasm or willingness to learn without supporting
        evidence.
      NO_EVIDENCE_FOUND: Nothing identified.
    rationale: >
      Anchored in the spec's explicit statement that curiosity and technical
      potential matter more than prior motorsport interest.

  - criterion_id: E4
    description: >
      Values evidence: concrete examples consistent with the authorised
      behaviours Accountable, Brave, Competitive, Selfless. Evidence for all
      four is not required from a CV; assess the strength of behavioural
      evidence available.
    category: VALUES_BEHAVIOURS
    essential: true
    spec_source: "Demonstrate how your experiences … reflect our shared values: Accountable, Brave, Competitive and Selfless"
    authorised_values: [Accountable, Brave, Competitive, Selfless]   # open item S4 (verified vs spec)
    weighting: null
    evidence_expectation:
      STRONG_EVIDENCE: >
        Several concrete examples demonstrating different relevant behaviours,
        with the candidate's contribution clear.
      EVIDENCE: >
        At least one convincing example of behaviour aligned with the stated
        values.
      PARTIAL_EVIDENCE: Values or characteristics are asserted but not demonstrated.
      NO_EVIDENCE_FOUND: No relevant behavioural evidence.
    rationale: >
      Spec essential criterion (verbatim coverage confirmed).

  # ----- PROPOSED ADDITION — active only after owner approval (open item S5) -----
  - criterion_id: E5
    status: PROPOSED_OWNER_REVIEW
    description: >
      Engineering background: a strong background in an engineering discipline,
      with excellent skills in Mathematics and Physics.
    category: TECHNICAL_FOUNDATION
    essential: true
    spec_source: "Have a strong background in an engineering discipline, with excellent skills in Mathematics and Physics."
    weighting: null
    evidence_expectation:
      STRONG_EVIDENCE: >
        Engineering degree discipline clearly relevant (e.g. Aerospace,
        Mechanical, Motorsport, Aeronautical) AND multiple concrete applications
        of mathematical/physical reasoning (e.g. CFD, FEA, dynamics, control).
      EVIDENCE: >
        Engineering degree discipline clearly relevant, OR one concrete
        application of mathematical/physical reasoning.
      PARTIAL_EVIDENCE: >
        Engineering discipline stated without evidence of applied
        mathematical/physical skills.
      NO_EVIDENCE_FOUND: No engineering background located.
    fairness_note: >
      Assess discipline and applied reasoning only. Do NOT score module marks,
      university ranking or predicted grades unless the owner adds an explicit
      rule; grades are self-reported and correlate with factors unrelated to
      capability. Default: record grades as evidence context, do not let them
      move the band.
    rationale: >
      PROPOSED because the spec lists this as essential but the draft framework
      had no corresponding criterion (v0.1 coverage gap found on 2026-10-28).

  - criterion_id: D1
    description: >
      Applied CAD / 3D design experience: has applied CAD, 3D modelling or
      another design tool to produce or develop engineering designs.
    category: TECHNICAL_SKILL
    essential: false
    spec_source: "Experience using CAD, 3D modelling or other design tools."
    weighting: null
    evidence_expectation:
      STRONG_EVIDENCE: >
        Recurring/substantial applied use across multiple projects, including
        design development or iteration.
      EVIDENCE: One clear project involving applied CAD/3D modelling.
      PARTIAL_EVIDENCE: >
        Software listed or proficiency self-declared without an applied example.
      NO_EVIDENCE_FOUND: No evidence.
    exclusions:
      - >
        Do NOT require CATIA specifically; any CAD/3D/design tool qualifies.
        Self-declared proficiency without application caps at PARTIAL.
        (Spec confirms: "CAD Proficiency: Hands-on experience with
        industry-standard CAD tools (CATIA 3DX)…" is listed under Key skills you
        will LEARN on placement.)
    rationale: >
      Spec desirable criterion (verbatim coverage confirmed).

  - criterion_id: D2
    description: >
      Computational tools and process improvement: application of programming,
      scripting, AI or other digital tools to solve a problem, automate work or
      improve an engineering process.
    category: DIGITAL_TOOLS
    essential: false
    spec_source: "Programming, scripting, practical use of AI tools, or experience improving engineering processes."
    weighting: null
    evidence_expectation:
      STRONG_EVIDENCE: Multiple applied examples and tangible improvement/outcome.
      EVIDENCE: One clear applied example.
      PARTIAL_EVIDENCE: Language/tool listed without an application.
      NO_EVIDENCE_FOUND: No evidence.
    rationale: >
      Spec desirable criterion (verbatim coverage confirmed).

  - criterion_id: D3
    description: >
      Team contribution and collaboration: effective contribution within a team,
      including working with others towards a shared technical or practical
      outcome.
    category: TEAMWORK
    essential: false
    spec_source: "An adaptable, proactive and collaborative approach, with the ability to contribute effectively in a team environment."
    weighting: null
    evidence_expectation:
      STRONG_EVIDENCE: >
        Clear personal contribution plus evidence of working across roles/
        disciplines or helping the wider team succeed.
      EVIDENCE: Clear contribution to a collaborative project.
      PARTIAL_EVIDENCE: Team membership stated without explaining their contribution.
      NO_EVIDENCE_FOUND: Nothing located.
    rationale: >
      Spec desirable criterion (verbatim coverage confirmed).

  - criterion_id: D4
    description: >
      Analytical rigour and attention to detail: a methodical approach to
      analysing, testing, validating or improving technical work.
    category: ANALYTICAL_RIGOUR
    essential: false
    spec_source: "Keen attention to detail, with an analytical and inquisitive approach."
    weighting: null
    evidence_expectation:
      STRONG_EVIDENCE: >
        Several concrete examples involving analysis/validation, with conclusions
        or resulting decisions.
      EVIDENCE: One clear analytical or validation example.
      PARTIAL_EVIDENCE: >
        Self-description such as "analytical" or "attention to detail" without an
        example.
      NO_EVIDENCE_FOUND: Nothing located.
    rationale: >
      Spec desirable criterion (verbatim coverage confirmed).

  - criterion_id: D5
    description: >
      Resilience, adaptability and improvement: effective response to setbacks,
      changing requirements, unsuccessful approaches or feedback, and subsequent
      learning or improvement.
    category: RESILIENCE
    essential: false
    spec_source: "Determination and resilience when facing challenges, with an interest in continuous improvement."
    weighting: null
    evidence_expectation:
      STRONG_EVIDENCE: >
        Specific examples showing challenge/change, response and subsequent
        improvement.
      EVIDENCE: One credible example.
      PARTIAL_EVIDENCE: >
        Candidate describes themselves as resilient/adaptable without evidence.
      NO_EVIDENCE_FOUND: Nothing located.
    rationale: >
      Spec desirable criterion (verbatim coverage confirmed).

# -----------------------------------------------------------------------------
# Framework-level assessment policy (defaults applied unless overridden)
# -----------------------------------------------------------------------------
policy:
  motorsport_interest: non_criterion   # spec: not required — never scored
  placement_skills: non_criterion      # spec "Key skills you will learn" — never scored
  academic_grades: context_only        # recorded, do not move bands (see E5 note)
  cover_letter_status: equal_source    # open item S3: letters count like CVs
  missing_cover_letter: no_penalty     # packet metadata only, never an outcome
  self_declared_proficiency: cap_at_partial   # listing/self-rating alone = PARTIAL
  quantified_claims: recorded_not_privileged  # numbers don't add weight by themselves
  sensitive_content: excluded          # redaction config, per plan §20
  missing_evidence_rule: null_not_zero # NO_EVIDENCE_FOUND never scores 0
